# Configuration for batch processing multiple SRA projects
# Each project can have different primers, merge parameters, and trim lengths

# List of projects to process
projects:
  - ProjectName1
  - ProjectName2
  - ProjectName3

# Project-specific settings
# Use this when different projects have different primers, trim lengths, etc.
project_settings:
  
  # Example Project 1
  ProjectName1:
    SRAid: SRAid1
    primerF:
    primerR:
    max_diffs_merge: 40
    minovlen_merge: 50
    p_trim_length:
    
  # Example Project 2
  ProjectName2:
    SRAid: SRAid2
    primerF:
    primerR:
    max_diffs_merge: 40
    minovlen_merge: 50
    p_trim_length:
    
  # Example Project 3: Using V9 primers
  ProjectName3:
    SRAid: SRAid3
    primerF:
    primerR:
    max_diffs_merge: 40
    minovlen_merge: 50
    p_trim_length:

# Shared settings across all projects
raw_data: "data/raw/"
output: "results/"
visualization: "results/visualizations/"
taxonomy_fasta: "reference/reference_database.qza"
trained_ref_database: "reference/classifier.qza"
REFFASTA: "reference/reference_database.qza"

# Eukaryote reference files
EUK_TREE: "reference/euk_tree.tree"
MSA_FASTA_EUK: "reference/eukaryotic_reference_tree.fasta"
MSA_PHYLIP_EUK: "reference/eukaryotic_reference_tree.phy"
CLADES_EUKS: "reference/eukaryotic_reference_tax.txt"

# Taxon reference files
TAXON_TREE: "reference/Taxon_tree.tree"
MSA_FASTA_TAXON: "reference/Taxon_reference_tree.fasta"
MSA_PHYLIP_TAXON: "reference/Taxon_reference_tree.phy"
CLADES_TAXON: "reference/Taxon_reference_tax.txt"

# Clade 1 reference files
CLADE1_TREE: "reference/Clade1_tree.tree"
MSA_FASTA_CLADE1: "reference/Clade1_reference_tree.fasta"
MSA_PHYLIP_CLADE1: "reference/Clade1_reference_tree.phy"
CLADES_CLADE1: "reference/Clade1_reference_tax.txt"

# Clade 2 reference files
CLADE2_TREE: "reference/Clade2_tree.tree"
MSA_FASTA_CLADE2: "reference/Clade2_reference_tree.fasta"
MSA_PHYLIP_CLADE2: "reference/Clade2_reference_tree.phy"
CLADES_CLADE2: "reference/Clade2_reference_tax.txt"

# Scuti reference files
CLADE3_TREE: "reference/Clade3_tree.tree"
MSA_FASTA_CLADE3: "reference/Clade3_reference_tree.fasta"
MSA_PHYLIP_CLADE3: "reference/Clade3_reference_tree.phy"
CLADES_CLADE3: "reference/Clade3_reference_tax.txt"

# QIIME taxonomy --p-include filters (rules filter_table_taxa/filter_seqs_taxa
# and filter_table_unassigned/filter_seqs_unassigned)
p_include_taxa:
p_include_unassigned:

# Taxopath search terms for placement-result filtering (filter_by_taxopath.py)
# rule filter_Taxon: selects Taxon hits out of the eukaryotic tree's
# placements, feeding the Taxpm placement tier
search_term_Taxon: ""
# rules filter_Clade1 / filter_Clade2 / filter_Clade2: select clade candidates out
# of the taxa tree's placements, feeding the Clade1/Clade2/Clade3 trees
search_term_Clade1: ""
search_term_Clade2: ""
search_term_Clade3: ""

# Phylogenetic placement settings
epa_filter_acc_lwr: 0.99   # minimum accumulated LWR to retain placements
epa_filter_max: 100         # maximum number of placements per query sequence
gappa_mass_norm: "absolute" # mass normalisation for heat-tree (absolute or relative)
gappa_consensus_thresh: 0.7 # consensus threshold for taxonomic assignment
edpl_threshold: 0.05        # maximum EDPL for high-confidence placements





# Default settings (can be overridden per project)
p_min_length: 10
filter_minquality: 20
primer_err: 0.1
